faq:  # [ASUNCIÓN] docx G8 no fue respondida — preguntas genéricas del sector
  - pregunta: "¿Los cursos son presenciales o en línea?"
    respuesta: "Contáctanos para conocer la modalidad disponible para cada curso y grupo."
  - pregunta: "¿Qué material se necesita para los cursos?"
    respuesta: "El material se indica al inicio de cada ciclo. Escríbenos si tienes dudas específicas."
  - pregunta: "¿Cómo funciona el programa de intercambio?"
    respuesta: "El programa tiene una duración de una semana en Londres o París, con clases de idioma, actividades culturales y supervisión durante toda la estancia."
  - pregunta: "¿Desde qué edad pueden participar en el programa de intercambio?"
    respuesta: "El programa está dirigido a alumnos de entre 11 y 21 años, dependiendo del grupo y destino."
  - pregunta: "¿Cómo me inscribo o pido más información?"
    respuesta: "Puedes escribirnos por WhatsApp, correo electrónico o a través del formulario de contacto y te responderemos a la brevedad."

