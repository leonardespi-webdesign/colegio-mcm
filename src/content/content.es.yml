# [CONFIRMADO] idiomas ofrecidos — fuente: flyer "Un Mundo de Idiomas" (8 idiomas,
# logo real del colegio, cada uno mostrado con un ícono de bandera). Reemplaza
# la lista de 2 idiomas asumida anteriormente. La copia de venta por idioma es
# redacción propia (no cita literal del cliente), igual que ya era el caso para
# Inglés/Francés en la versión anterior.
# imagen: bandera del país asociado al idioma (flagcdn.com, servicio gratuito
# de banderas por código ISO), siguiendo el mismo patrón visual que ya usaba
# el flyer real del cliente. No es fotografía del colegio — es contenido
# ilustrativo estándar para un catálogo de cursos de idiomas.
idiomas:
  - nombre: "Inglés"
    slug: "ingles"
    descripcion: "Cursos de inglés para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El inglés abre puertas académicas y profesionales en cualquier campo. Nuestros cursos combinan práctica conversacional con una base gramatical sólida, en grupos pensados para el avance real de cada alumno."
    imagen: "https://flagcdn.com/w640/gb.png"
  - nombre: "Francés"
    slug: "frances"
    descripcion: "Cursos de francés para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El francés es una lengua de cultura y oportunidad internacional. Preparamos a nuestros alumnos con miras al programa de intercambio en París y a certificaciones internacionales."
    imagen: "https://flagcdn.com/w640/fr.png"
  - nombre: "Italiano"
    slug: "italiano"
    descripcion: "Cursos de italiano para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El italiano conecta con el arte, la gastronomía y la cultura de Italia. Nuestros cursos desarrollan la comprensión y expresión oral desde los primeros niveles."
    imagen: "https://flagcdn.com/w640/it.png"
  - nombre: "Alemán"
    slug: "aleman"
    descripcion: "Cursos de alemán para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El alemán es una lengua clave para la ciencia, la ingeniería y el intercambio académico en Europa. Nuestros cursos construyen una base gramatical sólida desde el inicio."
    imagen: "https://flagcdn.com/w640/de.png"
  - nombre: "Japonés"
    slug: "japones"
    descripcion: "Cursos de japonés para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El japonés abre las puertas a una cultura milenaria y a oportunidades académicas y profesionales en Asia. Nuestros cursos combinan escritura, lectura y conversación."
    imagen: "https://flagcdn.com/w640/jp.png"
  - nombre: "Coreano"
    slug: "coreano"
    descripcion: "Cursos de coreano para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El coreano conecta con una cultura de creciente influencia global. Nuestros cursos desarrollan la comprensión, habla, lectura y escritura desde cero."
    imagen: "https://flagcdn.com/w640/kr.png"
  - nombre: "Chino"
    slug: "chino"
    descripcion: "Cursos de chino mandarín para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El chino mandarín es un idioma estratégico para los negocios y el comercio internacional. Nuestros cursos introducen la escritura y la conversación de forma gradual."
    imagen: "https://flagcdn.com/w640/cn.png"
  - nombre: "Ruso"
    slug: "ruso"
    descripcion: "Cursos de ruso para todas las edades, de nivel principiante a avanzado."
    descripcion_venta: "El ruso abre las puertas a la literatura, la historia y las oportunidades de intercambio con el mundo de habla rusa. Nuestros cursos parten desde cero hasta niveles avanzados."
    imagen: "https://flagcdn.com/w640/ru.png"

